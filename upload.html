<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>上传论文 · 设计研究文献库</title>
<link rel="stylesheet" href="styles.css">
<style>
body { background: #fff; color: #111; }
nav { background: #fff; border-bottom: 1px solid #e5e7eb; }
nav a, nav .brand { color: #111 !important; }
nav .brand-accent { color: #4f46e5; }
.upload-shell { max-width: 520px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
.upload-panel { background: #fff; border: 1px solid #d1d5db; border-radius: 14px; padding: 2rem 2rem 2.4rem; box-shadow: 0 2px 12px rgba(0,0,0,0.07); }
.upload-kicker { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: #4f46e5; margin-bottom: .6rem; }
.upload-panel h1 { font-size: 1.4rem; font-weight: 700; margin: 0 0 1.6rem; color: #111; }
.upload-form { display: flex; flex-direction: column; gap: 1.1rem; }
.upload-form label { display: flex; flex-direction: column; gap: .35rem; font-size: .84rem; color: #374151; font-weight: 500; }
.upload-form input, .upload-form select {
  padding: .55rem .8rem; border-radius: 8px;
  background: #f9fafb; border: 1px solid #d1d5db;
  color: #111; font-size: .9rem;
}
.upload-form input:focus, .upload-form select:focus { outline: 2px solid #4f46e5; border-color: #4f46e5; }
.upload-form input[type=file] { padding: .4rem .5rem; }
#submit-btn {
  margin-top: .6rem; padding: .7rem 1.4rem; border-radius: 10px;
  background: #4f46e5; color: #fff; font-size: .95rem;
  font-weight: 600; border: none; cursor: pointer; transition: background .15s;
}
#submit-btn:hover:not(:disabled) { background: #4338ca; }
#submit-btn:disabled { opacity: .45; cursor: default; }
.status-panel { margin-top: 1.6rem; padding: 1.2rem 1.4rem; border-radius: 12px;
  background: #f9fafb; border: 1px solid #e5e7eb; }
.status-head { display: flex; justify-content: space-between; align-items: center;
  margin-bottom: .6rem; font-size: .84rem; font-weight: 600; color: #111; }
.status-track { height: 4px; background: #e5e7eb; border-radius: 2px; overflow: hidden; margin-bottom: .8rem; }
#status-bar { height: 100%; width: 0; background: #4f46e5; transition: width .6s; }
#status-message { font-size: .82rem; color: #6b7280; margin: 0 0 .5rem; }
.result-link { display: inline-block; margin-top: .6rem; padding: .5rem 1rem; border-radius: 8px;
  background: #ede9fe; color: #4f46e5; font-size: .85rem; font-weight: 600;
  text-decoration: none; border: 1px solid #c4b5fd; }
.token-hint { font-size: .75rem; color: #9ca3af; margin-top: -.3rem; line-height: 1.5; font-weight: 400; }
</style>
</head>
<body>
<nav>
  <a class="brand" href="index.html"><span class="brand-accent">&#9670;</span> 设计研究文献库</a>
  <div class="nav-links">
    <a href="index.html">目录</a>
    <a href="upload.html" class="active">上传</a>
  </div>
</nav>

<main class="upload-shell">
  <section class="upload-panel">
    <div class="upload-kicker">Private PDF Translation</div>
    <h1>上传论文</h1>
    <form id="upload-form" class="upload-form">
      <label>
        <span>GitHub Token（用于提交文件）</span>
        <input id="github-token" name="github-token" type="password" autocomplete="off" placeholder="ghp_…" required>
        <span class="token-hint">仅存储在浏览器本地，不会上传到任何服务器。可通过 URL 的 #token=… 预填。</span>
      </label>

      <label>
        <span>主题分类</span>
        <select id="theme" name="theme">
          <option value="theme1">设计介入跨学科协作</option>
          <option value="theme2">设计转译</option>
          <option value="theme3">新主题</option>
        </select>
      </label>

      <label>
        <span>PDF 文件（支持多选）</span>
        <input id="pdf" name="pdf" type="file" accept="application/pdf,.pdf" multiple required>
      </label>

      <button id="submit-btn" type="submit">上传并翻译</button>
    </form>

    <div id="status-panel" class="status-panel" hidden>
      <div class="status-head">
        <span id="status-label">等待上传</span>
        <span id="status-pct">0%</span>
      </div>
      <div class="status-track"><div id="status-bar"></div></div>
      <p id="status-message"></p>
      <a id="result-link" class="result-link" href="#" target="_blank" rel="noreferrer" hidden>打开新论文页面 →</a>
    </div>
  </section>
</main>

<script>
(function () {
  const OWNER  = "zijixie";
  const REPO   = "papers-site";
  const BRANCH = "main";
  const API    = `https://api.github.com/repos/${OWNER}/${REPO}`;
  const PUBLIC = "https://zijixie.github.io/papers-site";

  const form    = document.getElementById("upload-form");
  const btn     = document.getElementById("submit-btn");
  const panel   = document.getElementById("status-panel");
  const labelEl = document.getElementById("status-label");
  const pctEl   = document.getElementById("status-pct");
  const barEl   = document.getElementById("status-bar");
  const msgEl   = document.getElementById("status-message");
  const linkEl  = document.getElementById("result-link");
  const tokenEl = document.getElementById("github-token");

  // Pre-fill token from URL hash (#token=ghp_...) or localStorage
  const hashParams = new URLSearchParams(window.location.hash.slice(1));
  const hashToken = hashParams.get("token") || hashParams.get("github_token");
  if (hashToken) {
    localStorage.setItem("papers_github_token", hashToken);
    history.replaceState(null, "", window.location.pathname);
  }
  tokenEl.value = localStorage.getItem("papers_github_token") || "";

  function setStatus(label, pct, msg) {
    panel.hidden = false;
    labelEl.textContent = label;
    pctEl.textContent = Math.round(pct) + "%";
    barEl.style.width = Math.round(pct) + "%";
    msgEl.textContent = msg;
  }

  async function ghRequest(method, path, body) {
    const token = tokenEl.value.trim();
    const res = await fetch(`${API}${path}`, {
      method,
      headers: {
        "Authorization": `Bearer ${token}`,
        "Accept": "application/vnd.github+json",
        "X-GitHub-Api-Version": "2022-11-28",
        ...(body ? {"Content-Type": "application/json"} : {}),
      },
      ...(body ? {body: JSON.stringify(body)} : {}),
    });
    if (!res.ok) {
      const text = await res.text();
      throw new Error(`GitHub ${method} ${path} → ${res.status}: ${text.slice(0, 300)}`);
    }
    return res.json();
  }

  async function listPaperNames() {
    try {
      const items = await ghRequest("GET", `/contents/?ref=${BRANCH}&t=${Date.now()}`);
      return items.filter(f => /^paper\d+\.html$/.test(f.name)).map(f => f.name);
    } catch { return []; }
  }

  async function pushFile(pendingPath, arrayBuffer, commitMsg) {
    // Convert ArrayBuffer to base64
    const bytes = new Uint8Array(arrayBuffer);
    let binary = "";
    for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
    const base64 = btoa(binary);

    // Check if file already exists (get sha for update)
    let sha;
    try {
      const info = await ghRequest("GET", `/contents/${pendingPath}?ref=${BRANCH}`);
      sha = info.sha;
    } catch (e) {
      if (!String(e.message).includes("404")) throw e;
    }
    const body = {message: commitMsg, content: base64, branch: BRANCH};
    if (sha) body.sha = sha;
    await ghRequest("PUT", `/contents/${pendingPath}`, body);
  }

  async function pollForNewPaper(beforeNames, maxWaitMs) {
    const interval = 25000;
    const deadline = Date.now() + maxWaitMs;
    while (Date.now() < deadline) {
      await new Promise(r => setTimeout(r, interval));
      const elapsed = Math.round((Date.now() - (deadline - maxWaitMs)) / 1000);
      const mins = Math.floor(elapsed / 60);
      const secs = elapsed % 60;
      const timeStr = mins > 0 ? `${mins}分${secs}秒` : `${secs}秒`;
      setStatus("处理中…", 60 + Math.min(elapsed / (maxWaitMs / 1000) * 30, 28),
        `已等待 ${timeStr}，后台正在提取文本、核验出版信息并逐段翻译，请稍候…`);
      const afterNames = await listPaperNames();
      const newPapers = afterNames.filter(n => !beforeNames.includes(n));
      if (newPapers.length > 0) {
        newPapers.sort();
        return `${PUBLIC}/${newPapers[newPapers.length - 1]}`;
      }
    }
    return null;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const token = tokenEl.value.trim();
    if (!token) { alert("请输入 GitHub Token"); return; }
    localStorage.setItem("papers_github_token", token);

    const files = Array.from(document.getElementById("pdf").files);
    if (!files.length) { alert("请选择 PDF 文件"); return; }

    const themeSlug = document.getElementById("theme").value;
    btn.disabled = true;
    linkEl.hidden = true;

    try {
      setStatus("准备中…", 5, "正在读取当前论文列表…");
      const beforeNames = await listPaperNames();

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        setStatus("上传中…", 10 + (i / files.length) * 40,
          `正在上传 ${file.name}（${i + 1}/${files.length}）`);
        const buf = await file.arrayBuffer();
        const ts = Date.now();
        const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
        const pendingName = `${themeSlug}_${ts}_${safeName}`;
        await pushFile(`pending/${pendingName}`, buf,
          `Upload PDF for translation: ${file.name}`);
      }

      setStatus("已提交！", 55,
        `${files.timing ? "" : ""}${files.length} 个 PDF 已推送到 pending/，后台每 5 秒轮询一次，约 3–8 分钟后完成翻译并部署…`);

      // 每 25 秒轮询，最多等 15 分钟
      const url = await pollForNewPaper(beforeNames, 15 * 60 * 1000);
      if (url) {
        setStatus("完成！", 100, "翻译完成，新论文页面已部署到 GitHub Pages。");
        linkEl.href = url;
        linkEl.hidden = false;
      } else {
        setStatus("后台仍在运行", 90,
          "超时未检测到新论文（可能需要更长时间）。请稍后刷新首页查看，或检查后台 watcher 日志。");
      }
    } catch (err) {
      setStatus("出错", 0, `错误：${err.message}`);
      console.error(err);
    } finally {
      btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
